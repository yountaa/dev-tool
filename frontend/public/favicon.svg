<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Та же эмблема, что в рельсе (src/App.vue): кольцо-апертура «O» из Observability
       и линия метрики насквозь. Геометрия — знак из 24-сетки, увеличенный в 2.333
       относительно центра (32,32): круг r=21, концы линии на 18 и 46, пик и провал
       на ±2.8 от центра по горизонтали и ±10.27 по вертикали. Симметрия обязательна:
       без неё знак заметно заваливается набок даже на 16px. Цвет взят из переменной
       accent-bright тёмной темы — тот же, которым эмблема нарисована в шапке.
       ВНИМАНИЕ: это XML, в комментарии нельзя писать два дефиса подряд (даже в
       названии CSS-переменной) — файл сразу перестаёт разбираться и иконка пропадает. -->
  <rect width="64" height="64" rx="15" fill="#282a36"/>
  <g fill="none" stroke="#d3b3ff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="21"/>
    <path d="M18 32h7.47l3.73-10.27 5.6 20.54 3.73-10.27H46"/>
  </g>
</svg>
